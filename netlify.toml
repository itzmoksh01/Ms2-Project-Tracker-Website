# Netlify configuration for MS2 Project Tracker
# https://ms2-project-tracker.netlify.app

[build]
  command = "npm run build:client"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@google/genai"]

# Route the app's API calls to the Netlify Function (mirrors server.ts)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA fallback — serve index.html for all frontend routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
